# Scénario de stress : beaucoup de voitures, batteries courtes
# Vise à saturer les stations et forcer les choix de stratégie
seed: 123
max_ticks: 200

map:
  type: grid
  width: 10
  height: 5
  node_spacing_m: 100.0
  station_positions:
    - [3, 2]
    - [7, 3]

cars:
  count: 20
  initial_battery: 0.5
  max_battery_kwh: 60.0
  consumption_kwh_per_km: 0.2
  battery_threshold: 0.3

stations:
  pumps_per_station: 2
  pump_power_kw: 30.0
  price_euros_per_kwh: 0.40